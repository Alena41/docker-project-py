name: Deploy and Test Notebook App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        shell: powershell
        run: |
          "DB_USER=${{ secrets.DB_USER }}" | Out-File -FilePath .env -Encoding utf8
          "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" | Out-File -FilePath .env -Encoding utf8 -Append
          "DB_NAME=${{ secrets.DB_NAME }}" | Out-File -FilePath .env -Encoding utf8 -Append
          Write-Host ".env file created successfully."

      - name: Deploy with Docker Compose
        shell: powershell
        run: |
          docker rm -f notebook-db notebook-app 2>$null
          docker compose down -v
          docker compose up -d --build
          
          Write-Host "Waiting for services to be healthy..."
          Start-Sleep -Seconds 20

      - name: Verify containers are running
        shell: powershell
        run: |
          docker compose ps
          $psOutput = docker compose ps
          if ($psOutput -match "Exit") {
            Write-Host "Some containers failed to start. Logs:"
            docker compose logs
            exit 1
          }
          Write-Host "All containers are running."

      - name: Test application and database
        shell: powershell
        run: |
          Write-Host "--- Test 1: Application Health ---"
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing
            if ($response.StatusCode -eq 200) {
              Write-Host "Web application is responding on port 8080"
            }
          } catch {
            Write-Host "Web application is not responding"
            exit 1
          }

          Write-Host "--- Test 2: Data consistency ---"
          
          $dbCountRaw = docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM notes;"
          $dbCount = $dbCountRaw.Trim()

          $apiResponse = Invoke-RestMethod -Uri "http://localhost:8080/api/notes"
          $webCount = $apiResponse.Count
          
          Write-Host "Database notes count: $dbCount"
          Write-Host "Web API notes count:   $webCount"

          if ([int]$dbCount -eq [int]$webCount) {
            Write-Host "Data consistency test PASSED. The database and web interface show the same data."
          } else {
            Write-Host "Data consistency test FAILED. Mismatch in counts."
            exit 1
          }

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-artifacts
          path: |
            .env
            docker-compose.yml
          retention-days: 7

      - name: Save Docker logs
        shell: powershell
        if: always()
        run: |
          docker compose logs > deployment-logs.txt

      - name: Upload Docker logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-logs
          path: deployment-logs.txt
          retention-days: 7