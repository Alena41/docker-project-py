name: Deploy and Test Notebook App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from secrets
        run: |
          echo "DB_USER=${{ secrets.DB_USER }}" > .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo ".env file created successfully."


      - name: Deploy with Docker Compose
        run: |
          docker compose down -v
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          Start-Sleep -Seconds 20

      - name: Verify containers are running
        run: |
          docker compose ps
          # В PowerShell нет grep, используем Select-String
          $psOutput = docker compose ps
          if ($psOutput -match "Exit") {
            echo "Some containers failed to start. Logs:"
            docker compose logs
            exit 1
          }
          echo "All containers are running."

      - name: Test application and database
        run: |
          echo "--- Test 1: Application Health ---"
          try {
            $response = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing
            if ($response.StatusCode -eq 200) {
              echo "Web application is responding on port 8080"
            }
          } catch {
            echo "Web application is not responding"
            exit 1
          }

          echo "--- Test 2: Data consistency ---"
          
          # Получаем данные из БД
          $dbCountRaw = docker compose exec -T db psql -U ${{ secrets.DB_USER }} -d ${{ secrets.DB_NAME }} -t -c "SELECT COUNT(*) FROM notes;"
          $dbCount = $dbCountRaw.Trim()

          # Получаем данные из API
          $apiResponse = Invoke-RestMethod -Uri "http://localhost:8080/api/notes"
          $webCount = $apiResponse.Count
          
          echo "Database notes count: $dbCount"
          echo "Web API notes count:   $webCount"

          if ([int]$dbCount -eq [int]$webCount) {
            echo "Data consistency test PASSED. The database and web interface show the same data."
          } else {
            echo "Data consistency test FAILED. Mismatch in counts."
            exit 1
          }

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-artifacts
          path: |
            .env
            docker-compose.yml
          retention-days: 7

      - name: Save Docker logs
        if: always()
        run: |
          docker compose logs > deployment-logs.txt

      - name: Upload Docker logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-logs
          path: deployment-logs.txt
          retention-days: 7